<!-- ================================================= -->
<!-- MAIN CONTENT -->
<!-- ================================================= -->

<main class="dashboard-content">

<div class="dashboard-header">

<div>

<h1>

Post New Job

</h1>

<p>

Publish a verified opportunity for Udayan Care Shalini Candidates.

</p>

</div>

</div>

<!-- ================================================= -->
<!-- COMPANY ROW -->
<!-- ================================================= -->

<section
class="card"

style="padding:18px 24px;
margin-bottom:25px;">

<div
style="display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
gap:15px;">

<div>

<h3
id="companyName"
style="margin:0;">

Loading...

</h3>

</div>

<div>

<strong>

Employer ID :

</strong>

<span id="companyEmployerID">

--

</span>

</div>

</div>

<input
type="hidden"
id="company_name">

</section>

<!-- ================================================= -->
<!-- JOB FORM -->
<!-- ================================================= -->

<section
class="card"
style="padding:30px;">

<form id="postJobForm">

<!-- ================================================= -->
<!-- BASIC JOB DETAILS -->
<!-- ================================================= -->

<h3 style="margin-bottom:20px;">

Basic Job Information

</h3>

<div class="dashboard-grid">

<div class="form-group">

<label>

Job Title *

</label>

<input
type="text"
id="jobTitle"
class="form-control"
placeholder="Customer Support Executive"
required>

</div>

<div class="form-group">

<label>

Job Category *

</label>

<select
id="jobCategory"
class="form-control"
required>

<option value="">

Select Category

</option>

<option>Administration</option>

<option>BPO / Customer Support</option>

<option>Education</option>

<option>Finance</option>

<option>Healthcare</option>

<option>Hospitality</option>

<option>Human Resources</option>

<option>IT / Software</option>

<option>Manufacturing</option>

<option>Marketing</option>

<option>Operations</option>

<option>Retail</option>

<option>Sales</option>

<option>Security</option>

<option>Telecalling</option>

<option>Warehouse</option>

<option>Other</option>

</select>

</div>

<div class="form-group">

<label>

Job Type *

</label>

<select
id="jobType"
class="form-control"
required>

<option value="">

Select Job Type

</option>

<option>Full Time</option>

<option>Part Time</option>

<option>Internship</option>

<option>Contract</option>

<option>Temporary</option>

<option>Freelance</option>

</select>

</div>

<div class="form-group">

<label>

Work Mode *

</label>

<select
id="workMode"
class="form-control"
required>

<option value="">

Select Work Mode

</option>

<option>Office</option>

<option>Hybrid</option>

<option>Remote</option>

</select>

</div>

</div>

<hr style="margin:30px 0;">

  <!-- ================================================= -->
<!-- JOB LOCATION -->
<!-- ================================================= -->

<h3 style="margin-bottom:20px;">

Job Location

</h3>

<div class="dashboard-grid">

<div class="form-group">

<label>

State *

</label>

<input
type="text"
id="state"
class="form-control"
placeholder="State"
required>

</div>

<div class="form-group">

<label>

District *

</label>

<input
type="text"
id="district"
class="form-control"
placeholder="District"
required>

</div>

<div class="form-group">

<label>

City *

</label>

<input
type="text"
id="city"
class="form-control"
placeholder="City"
required>

</div>

<div class="form-group">

<label>

Complete Address *

</label>

<input
type="text"
id="address"
class="form-control"
placeholder="Office Address"
required>

</div>

</div>

<hr style="margin:30px 0;">

<!-- ================================================= -->
<!-- ELIGIBILITY -->
<!-- ================================================= -->

<h3 style="margin-bottom:20px;">

Eligibility & Salary

</h3>

<div class="dashboard-grid">

<div class="form-group">

<label>

Qualification *

</label>

<select
id="qualification"
class="form-control"
required>

<option value="">Select</option>

<option>10th Pass</option>

<option>12th Pass</option>

<option>ITI</option>

<option>Diploma</option>

<option>Graduate</option>

<option>Post Graduate</option>

<option>Any Qualification</option>

</select>

</div>

<div class="form-group">

<label>

Experience *

</label>

<select
id="experience"
class="form-control"
required>

<option value="">Select</option>

<option>Fresher</option>

<option>0-1 Year</option>

<option>1-2 Years</option>

<option>2-3 Years</option>

<option>3-5 Years</option>

<option>5+ Years</option>

</select>

</div>

<div class="form-group">

<label>

Vacancies *

</label>

<input
type="number"
id="vacancies"
class="form-control"
placeholder="10"
required>

</div>

<div class="form-group">

<label>

Last Date *

</label>

<input
type="date"
id="applicationLastDate"
class="form-control"
required>

</div>

</div>

<br>

<div class="dashboard-grid">

<div class="form-group">

<label>

Minimum Salary *

</label>

<input
type="number"
id="salaryMin"
class="form-control"
placeholder="15000"
required>

</div>

<div class="form-group">

<label>

Maximum Salary *

</label>

<input
type="number"
id="salaryMax"
class="form-control"
placeholder="25000"
required>

</div>

<div class="form-group">

<label>

Job Status

</label>

<select
id="jobStatus"
class="form-control">

<option selected>

Active

</option>

<option>

Closed

</option>

</select>

</div>

<div class="form-group">

<label>

Skills *

</label>

<input
type="text"
id="skills"
class="form-control"
placeholder="Communication, Excel, Sales"
required>

</div>

</div>

<hr style="margin:30px 0;">
